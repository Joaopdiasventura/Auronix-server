spring.application.name=auronix

server.port=${PORT:8080}
server.shutdown=${SERVER_SHUTDOWN:graceful}
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/auronix}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=${SQL_INIT_MODE:never}

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://localhost:5672/}
spring.rabbitmq.username=${RABBITMQ_USERNAME:user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:user}
spring.rabbitmq.listener.simple.retry.enabled=${RABBITMQ_RETRY_ENABLED:true}
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
spring.rabbitmq.listener.simple.retry.max-retries=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.max-interval=${RABBITMQ_RETRY_MAX_INTERVAL:10000}
spring.rabbitmq.listener.simple.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2}

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:false}
management.endpoint.health.group.liveness.include=${MANAGEMENT_HEALTH_LIVENESS_INCLUDE:livenessState}
management.endpoint.health.group.readiness.include=${MANAGEMENT_HEALTH_READINESS_INCLUDE:readinessState,db,rabbit,redis}

app.instance-id=${APP_INSTANCE_ID:${random.uuid}}
app.cors.allowed-origins=${CLIENT_URLS:http://localhost:4200}

security.jwt.secret=${JWT_SECRET:auronix}
security.jwt.expires-in-minutes=${JWT_EXPIRES_IN_MINUTES:120}
security.cookie.secure=${COOKIE_SECURE:false}
security.cookie.same-site=${COOKIE_SAME_SITE:Strict}
