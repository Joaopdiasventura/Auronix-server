spring.application.name=auronix-test

spring.datasource.url=jdbc:h2:mem:auronix-test;MODE=PostgreSQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.sql.init.mode=never

spring.rabbitmq.addresses=amqp://invalid.invalid:1/
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

spring.data.redis.url=redis://invalid.invalid:1

management.health.rabbit.enabled=false
management.health.redis.enabled=false

app.instance-id=test-instance
app.cors.allowed-origins=http://localhost:4200

security.jwt.secret=test-only-secret
security.jwt.expires-in-minutes=120
security.cookie.secure=false
security.cookie.same-site=Strict
