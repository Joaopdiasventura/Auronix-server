name: Continuous Integration and Deployment

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: docker.io/jpplay/auronix-server
  JAVA_VERSION: "26"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Resolve dependencies
        run: ./mvnw -B dependency:go-offline

      - name: Run tests
        run: ./mvnw -B test

      - name: Build application
        run: ./mvnw -B package -DskipTests

  publish:
    name: Publish Docker image
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=auronix-server
          cache-to: type=gha,mode=max,scope=auronix-server

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy Application
    runs-on: self-hosted
    needs: publish
    timeout-minutes: 15
    env:
      DOTENV: ${{ secrets.DOTENV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write dotenv to file
        run: |
          printf '%s\n' "$DOTENV" > .env
          chmod 600 .env

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Pull images
        run: docker pull "$IMAGE_NAME@${{ needs.publish.outputs.image_digest }}"

      - name: Deploy server container
        run: |
          docker rm -f auronix-server || true
          docker run -d \
            --name auronix-server \
            --restart=always \
            --network cloudflare_tunnel \
            --env-file .env \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --memory=1024m \
            --memory-swap=1024m \
            --cpus=1.0 \
            --pids-limit=256 \
            "$IMAGE_NAME@${{ needs.publish.outputs.image_digest }}"

      - name: Remove unused images
        run: docker image prune -f -a
