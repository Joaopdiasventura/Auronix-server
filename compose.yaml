services:
  server:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/auronix
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RABBITMQ_URL: amqp://message-br:5672/
      RABBITMQ_USERNAME: user
      RABBITMQ_PASSWORD: user
      REDIS_URL: redis://cache:6379
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: true
      JPA_FORMAT_SQL: true
      MANAGEMENT_HEALTH_PROBES_ENABLED: true
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
      message-br:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - auronix-local

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auronix
    volumes:
      - auronix-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auronix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auronix-local

  message-br:
    image: rabbitmq:4-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
    volumes:
      - auronix-rabbitmq:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - auronix-local

  cache:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - auronix-redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auronix-local

volumes:
  auronix-data:
  auronix-rabbitmq:
  auronix-redis:

networks:
  auronix-local:
