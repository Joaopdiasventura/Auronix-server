apiVersion: v1
kind: Secret
metadata:
  name: auronix-secrets
  namespace: auronix
  labels:
    app.kubernetes.io/name: auronix
type: Opaque
stringData:
  DATABASE_USERNAME: auronix
  DATABASE_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  RABBITMQ_USERNAME: auronix
  RABBITMQ_PASSWORD: REPLACE_WITH_RABBITMQ_PASSWORD
  JWT_SECRET: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
