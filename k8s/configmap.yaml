apiVersion: v1
kind: ConfigMap
metadata:
  name: auronix-config
  namespace: auronix
  labels:
    app.kubernetes.io/name: auronix
data:
  PORT: "8080"
  DATABASE_URL: "jdbc:postgresql://postgres:5432/auronix"
  RABBITMQ_URL: "amqp://rabbitmq:5672/"
  REDIS_URL: "redis://redis:6379"
  JPA_DDL_AUTO: "validate"
  JPA_SHOW_SQL: "false"
  JPA_FORMAT_SQL: "false"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
