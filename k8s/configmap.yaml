apiVersion: v1
kind: ConfigMap
metadata:
  name: auronix-config
  namespace: auronix
  labels:
    app.kubernetes.io/name: auronix
data:
  PORT: "8080"
  SERVER_SHUTDOWN: "graceful"
  SHUTDOWN_TIMEOUT: "30s"
  DATABASE_URL: "jdbc:postgresql://REPLACE_WITH_RDS_ENDPOINT:5432/auronix"
  RABBITMQ_URL: "amqp://REPLACE_WITH_RABBITMQ_ENDPOINT:5672/"
  REDIS_URL: "redis://REPLACE_WITH_REDIS_ENDPOINT:6379"
  JPA_DDL_AUTO: "validate"
  JPA_SHOW_SQL: "false"
  JPA_FORMAT_SQL: "false"
  MANAGEMENT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESS_INCLUDE: "livenessState"
  MANAGEMENT_HEALTH_READINESS_INCLUDE: "readinessState,db,rabbit,redis"
